name: Build the Floppy Station

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Type check and test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install mypy mfusepy pywebview pystray types-pyserial "git+https://github.com/keirf/greaseweazle@latest"
      - name: Types
        run: python -m mypy --strict --ignore-missing-imports --allow-untyped-calls --allow-subclassing-any bridge_paths.py floppy_drive.py floppy_bridge.py station.py
      - name: Disk layer tests
        run: python test_drive.py
      - name: Bridge test on image files
        run: python test_bridge.py
      - name: Window test on image files
        run: python test_station.py

  build:
    name: Build ${{ matrix.name }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            artifact: dist/pc98-floppy-station
          - os: windows-latest
            name: windows
            artifact: dist/pc98-floppy-station.exe
          - os: macos-14
            name: macos
            artifact: dist/pc98-floppy-station-macos.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux build tools
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller mfusepy pywebview pystray "git+https://github.com/keirf/greaseweazle@latest"
      - name: Build
        run: pyinstaller station.spec
      - name: Zip the Mac app
        if: matrix.name == 'macos'
        run: cd dist && ditto -c -k --keepParent "PC-98 Floppy Station.app" pc98-floppy-station-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pc98-floppy-station-${{ matrix.name }}
          path: app/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      - name: Name the files
        run: |
          mkdir release
          cp out/pc98-floppy-station-linux/pc98-floppy-station release/pc98-floppy-station-linux
          cp out/pc98-floppy-station-windows/pc98-floppy-station.exe release/pc98-floppy-station-windows.exe
          cp out/pc98-floppy-station-macos/pc98-floppy-station-macos.zip release/pc98-floppy-station-macos.zip
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
