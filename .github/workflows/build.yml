name: Build the Floppy Station

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Type check and test
    runs-on: ubuntu-22.04
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: FUSE
        run: sudo apt-get update && sudo apt-get install -y fuse3 libfuse3-dev
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install "git+https://github.com/pyserial/pyserial@70d188643b031d10d2a2b9ea880bd56789fdb1f6"
          python -m pip install mypy mfusepy types-pyserial "git+https://github.com/keirf/greaseweazle@latest"
      - name: Types
        run: python -m mypy --strict --ignore-missing-imports --allow-untyped-calls --allow-subclassing-any bridge_paths.py floppy_drive.py floppy_bridge.py station.py test_drive.py test_bridge.py test_station.py
      - name: Disk layer tests
        run: python test_drive.py
      - name: Bridge test on image files
        run: python test_bridge.py
      - name: Window test on image files
        run: python test_station.py

  check-windows:
    name: Test on Windows
    runs-on: windows-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: WinFsp
        run: choco install winfsp -y --no-progress
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          python -m pip install mfusepy "git+https://github.com/keirf/greaseweazle@latest"
      - name: Disk layer tests
        run: python test_drive.py
      - name: Bridge test through WinFsp
        run: python test_bridge.py
      - name: Window test through WinFsp
        run: python test_station.py

  build:
    name: Build ${{ matrix.name }}
    needs: [check, check-windows]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            name: linux
            artifact: dist/pc98-floppy-station-x86_64.AppImage
          - os: windows-latest
            name: windows
            artifact: dist/pc98-floppy-station.exe
          - os: macos-15
            name: macos
            artifact: dist/pc98-floppy-station-macos.zip
          - os: macos-15-intel
            name: macos-intel
            artifact: dist/pc98-floppy-station-macos-intel.zip
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Linux build tools
        if: matrix.name == 'linux'
        run: sudo apt-get update && sudo apt-get install -y libfuse3-dev
      - name: Python packages
        run: |
          python -m pip install --upgrade pip
          # pyserial from its main branch: the 3.5 release can't set the board's control baud rates on glibc 2.42+
          python -m pip install "git+https://github.com/pyserial/pyserial@70d188643b031d10d2a2b9ea880bd56789fdb1f6"
          python -m pip install pyinstaller mfusepy "git+https://github.com/keirf/greaseweazle@latest"
      - name: Build
        run: pyinstaller station.spec
      - name: Linux AppImage
        if: matrix.name == 'linux'
        # One file with the icon and menu entry inside, which is how Linux desktops show a program.
        run: |
          sudo apt-get update && sudo apt-get install -y libfuse2
          curl -sSL -o appimagetool "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x appimagetool
          mkdir -p AppDir/usr/bin
          cp dist/pc98-floppy-station AppDir/usr/bin/
          cp icon.png AppDir/pc98-floppy-station.png
          printf '%s\n' '[Desktop Entry]' 'Type=Application' 'Name=PC-98 Floppy Station' 'Comment=Play PC-98 games from the real floppy drives' 'Exec=pc98-floppy-station' 'Icon=pc98-floppy-station' 'Terminal=false' 'Categories=Game;Emulator;' 'StartupWMClass=pc98-floppy-station' > AppDir/pc98-floppy-station.desktop
          printf '%s\n' '#!/bin/sh' 'HERE="$(dirname "$(readlink -f "$0")")"' 'exec "$HERE/usr/bin/pc98-floppy-station" "$@"' > AppDir/AppRun
          chmod +x AppDir/AppRun
          ARCH=x86_64 ./appimagetool AppDir dist/pc98-floppy-station-x86_64.AppImage
          ls -la dist
      - name: Zip the Mac app
        if: startsWith(matrix.name, 'macos')
        run: cd dist && ditto -c -k --keepParent "PC-98 Floppy Station.app" pc98-floppy-station-${{ matrix.name }}.zip
      - uses: actions/upload-artifact@v4
        with:
          name: pc98-floppy-station-${{ matrix.name }}
          path: app/${{ matrix.artifact }}
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
      # Only Linux and Windows have been run on a real machine. The Mac builds stay as
      # workflow artifacts for testing and join the release once they have been proven.
      - name: Name the files
        run: |
          mkdir release
          cp out/pc98-floppy-station-linux/pc98-floppy-station-x86_64.AppImage release/pc98-floppy-station-linux.AppImage
          cp out/pc98-floppy-station-windows/pc98-floppy-station.exe release/pc98-floppy-station-windows.exe
          ls -la release
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
